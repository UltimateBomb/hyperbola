name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      # The engine carries every rule worth testing and needs no system
      # libraries, so it is checked on its own and on every push.
      - run: cargo fmt --package hyperbola-core -- --check
      - run: cargo clippy --package hyperbola-core --all-targets -- -D warnings
      - run: cargo test --package hyperbola-core

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm --prefix ui ci
      - run: npm --prefix ui run build
