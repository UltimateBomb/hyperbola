name: release

# Tagging is what publishes an update: the app reads this repository's
# releases to decide whether it is out of date. The same workflow can be run
# by hand to get an installable build without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    name: windows installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm --prefix ui ci
      - run: npx tauri build --bundles nsis
      # The harness ships with the installer so the whole pipeline can be run
      # on a Windows machine without a window — which is how a Windows-only
      # problem gets diagnosed without asking someone to click through the app.
      - run: cargo build --release -p hyperbola-cli
      - name: collect installer
        shell: bash
        run: |
          mkdir -p dist
          # src-tauri is a workspace member, so cargo writes to the workspace
          # target directory, not to src-tauri/target.
          find target src-tauri/target -name "*-setup.exe" -exec cp {} dist/ \; 2>/dev/null || true
          cp target/release/hyperbola.exe dist/hyperbola-cli.exe
          ls -la dist
          test -n "$(ls -A dist)"
      - uses: actions/upload-artifact@v4
        with:
          name: hyperbola-windows-installer
          path: dist/*.exe
          if-no-files-found: error
      - name: attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          draft: true

  android:
    name: android apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: install ndk
        run: |
          sdkmanager "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm --prefix ui ci
      - run: npx tauri android init --ci
      - run: node scripts/android-prepare.mjs
      # One APK per ABI: the engine carries a Python runtime and ffmpeg for
      # every architecture, so a universal build is around 400 MB while a
      # single-architecture one is a quarter of that.
      #
      # Release, not debug: the debug library alone was 178 MB of unoptimised
      # code and symbols — several times the engine it carries.
      - run: npx tauri android build --apk --split-per-abi
      # A release APK is unsigned, and an unsigned APK cannot be installed.
      # This key is generated per run and is not a release identity: it makes
      # the build installable, nothing more. A stored key replaces it when
      # there is one, and then updates will install over each other.
      - name: sign
        run: |
          set -eu
          keytool -genkeypair -v -keystore build.jks -alias hyperbola \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass hyperbola -keypass hyperbola -dname "CN=Hyperbola build"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p dist
          for apk in $(find src-tauri/gen/android -name "*-unsigned.apk"); do
            aligned="dist/$(basename "${apk%-unsigned.apk}").apk"
            "$tools/zipalign" -p -f 4 "$apk" "$aligned"
            "$tools/apksigner" sign --ks build.jks --ks-pass pass:hyperbola \
              --key-pass pass:hyperbola "$aligned"
            "$tools/apksigner" verify "$aligned"
          done
          rm -f build.jks dist/*.idsig
          ls -la dist
      - name: collect apk
        run: |
          mkdir -p dist
          # Anything the signing step did not already place there.
          find src-tauri/gen/android -name "*.apk" ! -name "*-unsigned.apk" -exec cp -n {} dist/ \;
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: hyperbola-android-apk
          path: dist/*.apk
          if-no-files-found: error
      - name: attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          draft: true
