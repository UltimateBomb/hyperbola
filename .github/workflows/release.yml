name: release

# Tagging is what publishes an update: the app reads this repository's
# releases to decide whether it is out of date.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    name: windows installer
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm --prefix ui ci
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Hyperbola ${{ github.ref_name }}
          releaseDraft: true
          args: --bundles nsis
