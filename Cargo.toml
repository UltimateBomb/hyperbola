[workspace]
members = ["crates/cli", "crates/core", "crates/runner", "plugins/ytdlp-android", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-or-later"
repository = "https://github.com/UltimateBomb/hyperbola"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# The Android library ships inside the APK, so its size is the app's size:
# an unoptimised build with full symbols came to 178 MB on its own.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
